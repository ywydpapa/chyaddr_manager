<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>새 템플릿 등록</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- CodeMirror CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/dracula.min.css">

    <style>
        /* CodeMirror 에디터 높이 설정 */
        .CodeMirror {
            height: 600px;
            border-radius: 0.375rem;
            font-family: 'D2Coding', 'Consolas', monospace;
            font-size: 14px;
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans">

<div class="max-w-7xl mx-auto py-8 px-4 sm:px-6 lg:px-8">
    <div class="bg-white shadow-lg rounded-lg overflow-hidden">

        <!-- 헤더 영역 -->
        <div class="bg-gray-800 px-6 py-4 flex justify-between items-center">
            <h2 class="text-xl font-bold text-white">📝 새 템플릿 등록</h2>
            <div>
                <button type="button" onclick="history.back()" class="bg-gray-600 hover:bg-gray-500 text-white px-4 py-2 rounded text-sm font-medium transition mr-2">
                    취소
                </button>
                <button type="button" onclick="createTemplate()" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded text-sm font-bold transition">
                    등록하기
                </button>
            </div>
        </div>

        <!-- 폼 영역 -->
        <div class="p-6">
            <form id="templateForm" class="space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- 템플릿 제목 (tempTitle) -->
                    <div class="md:col-span-2">
                        <label for="tempTitle" class="block text-sm font-bold text-gray-700 mb-1">템플릿 제목 <span class="text-red-500">*</span></label>
                        <input type="text" id="tempTitle" name="tempTitle" placeholder="예: [신규] 충효예 대학 산악회 참석 안내"
                               class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500">
                    </div>

                    <!-- 템플릿 타입 (tempType) -->
                    <div>
                        <label for="tempType" class="block text-sm font-bold text-gray-700 mb-1">템플릿 타입</label>
                        <select id="tempType" name="tempType" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500">
                            <option value="PRINT">인쇄용 (A4)</option>
                            <option value="SMS">문자발송용 (이미지)</option>
                            <option value="EMAIL">이메일용</option>
                            <option value="ETC">기타</option>
                        </select>
                    </div>

                    <!-- 배경 이미지 (tempBg) -->
                    <div>
                        <label for="tempBg" class="block text-sm font-bold text-gray-700 mb-1">배경 이미지 경로 (tempBg)</label>
                        <input type="text" id="tempBg" name="tempBg" placeholder="/static/img/bg-default.jpg"
                               class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500">
                    </div>

                    <!-- 프레임 이미지 (tempFr) -->
                    <div class="md:col-span-2">
                        <label for="tempFr" class="block text-sm font-bold text-gray-700 mb-1">프레임 이미지 경로 (tempFr)</label>
                        <input type="text" id="tempFr" name="tempFr" placeholder="/static/img/frame-default.png"
                               class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500">
                    </div>
                </div>

                <!-- 템플릿 내용 (tempContents) -->
                <div class="mt-6">
                    <div class="flex justify-between items-end mb-2">
                        <label for="tempContents" class="block text-sm font-bold text-gray-700">템플릿 내용 (HTML & Jinja/Nunjucks) <span class="text-red-500">*</span></label>
                        <span class="text-xs text-gray-500">※ {% raw %}{{ 변수명 }}{% endraw %} 및 {% raw %}{% for %}{% endraw %} 문법을 사용할 수 있습니다.</span>
                    </div>
                    <div class="border border-gray-300 rounded-md overflow-hidden">
                        <textarea id="tempContents" name="tempContents"></textarea>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- CodeMirror JS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/xml/xml.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/javascript/javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/css/css.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/htmlmixed/htmlmixed.min.js"></script>

<script>
    // CodeMirror 에디터 초기화
    let editor;

    document.addEventListener("DOMContentLoaded", function() {
        editor = CodeMirror.fromTextArea(document.getElementById("tempContents"), {
            mode: "htmlmixed",
            theme: "dracula",
            lineNumbers: true,
            autoCloseTags: true,
            matchBrackets: true,
            indentUnit: 4,
            tabSize: 4,
            lineWrapping: true
        });

        // 신규 작성용 기본 HTML 뼈대 제공
        const defaultHTML = `<!DOCTYPE html>\n<html lang="ko">\n<head>\n    <meta charset="UTF-8">\n    <title>새 템플릿</title>\n    <style>\n        /* 여기에 CSS를 작성하세요 */\n        body { font-family: sans-serif; }\n    </style>\n</head>\n<body>\n\n    <!-- 여기에 HTML 및 Jinja 템플릿 코드를 작성하세요 -->\n    {% for member in members %}\n    <div>\n        {{ member.memberName }}님\n    </div>\n    {% endfor %}\n\n</body>\n</html>`;
        editor.setValue(defaultHTML);
    });

    // 신규 등록 함수 (API 연동 예시)
    function createTemplate() {
        // CodeMirror의 내용을 textarea에 동기화
        editor.save();

        const tempTitle = document.getElementById('tempTitle').value;
        const tempType = document.getElementById('tempType').value;
        const tempBg = document.getElementById('tempBg').value;
        const tempFr = document.getElementById('tempFr').value;
        const tempContents = document.getElementById('tempContents').value;

        // 필수 입력값 검증
        if (!tempTitle.trim()) {
            alert("템플릿 제목을 입력해주세요.");
            document.getElementById('tempTitle').focus();
            return;
        }

        if (!tempContents.trim()) {
            alert("템플릿 내용을 입력해주세요.");
            return;
        }

        // 서버로 전송할 데이터 객체 생성 (attrib 제거됨)
        const requestData = {
            tempTitle: tempTitle,
            tempType: tempType,
            tempBg: tempBg,
            tempFr: tempFr,
            tempContents: tempContents
        };
        console.log("서버로 전송할 신규 데이터:", requestData);
        fetch('/api/addtemplates', {  // 백엔드 등록 API 주소로 변경하세요
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify(requestData)
        })
        .then(response => response.json())
        .then(data => {
            if(data.success) {
                alert('새 템플릿이 성공적으로 등록되었습니다.');
                location.href = '/tempList'; // 목록 페이지로 이동
            } else {
                alert('등록 실패: ' + data.message);
            }
        })
        .catch(error => {
            console.error('Error:', error);
            alert('서버 통신 중 오류가 발생했습니다.');
        });
    }
</script>
</body>
</html>
