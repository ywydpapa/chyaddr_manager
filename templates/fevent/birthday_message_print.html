<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>생일 축하 서신 (일괄 출력)</title>
<style>
    /* 🖨️ 상단 출력 버튼 영역 */
    .print-btn-container {
        width: 100%;
        background-color: #333;
        padding: 15px 0;
        text-align: center;
        position: sticky;
        top: 0;
        z-index: 1000;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    .print-btn {
        background-color: #007bff;
        color: white;
        border: none;
        padding: 10px 30px;
        font-size: 16pt;
        font-weight: bold;
        border-radius: 5px;
        cursor: pointer;
        transition: background-color 0.3s;
    }
    .print-btn:hover {
        background-color: #0056b3;
    }

    /* 기본 설정 (화면용) */
    body {
        margin: 0;
        padding: 0;
        background-color: #f0f0f0;
        display: flex;
        flex-direction: column;
        align-items: center;
        font-family: 'Batang', '바탕', serif; /* 축하 서신에 어울리는 명조체 계열 */
        color: #111;
    }

    /* A4 페이지 기본 스타일 */
    .a4-page {
        width: 210mm;
        height: 297mm;
        padding: 25mm 20mm;
        background-color: white;
        box-sizing: border-box;
        box-shadow: 0 0 10px rgba(0,0,0,0.1);
        position: relative;
        margin-top: 20px;
        margin-bottom: 20px;
        display: flex;
        flex-direction: column;
        justify-content: center; /* 수직 중앙 정렬 */
        overflow: hidden;
    }

    /* 테두리 장식 (선택 사항 - 고급스러운 느낌 부여) */
    .border-box {
        border: 3px double #d4af37; /* 금색 느낌의 이중 테두리 */
        padding: 40px;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        box-sizing: border-box;
    }

    /* 수신자 영역 */
    .recipient {
        font-size: 26pt;
        font-weight: bold;
        text-align: left;
        margin-top: 30px;
        line-height: 1.5;
    }
    .recipient .name {
        font-size: 30pt;
    }

    /* 본문 메시지 영역 */
    .message {
        font-size: 32pt;
        line-height: 1.8;
        text-align: center;
        word-break: keep-all;
        margin: 60px 0;
    }

    /* 발신자 서명 영역 */
    .sender-area {
        text-align: right;
        margin-bottom: 30px;
        position: relative;
    }
    .sender-text {
        font-size: 28pt;
        font-weight: bold;
        letter-spacing: 2px;
        position: relative;
        display: inline-block;
        padding-right: 20px;
    }
    .main-stamp-img {
        position: absolute;
        right: -60px;
        top: 50%;
        transform: translateY(-50%);
        width: 90px;
        height: 90px;
        mix-blend-mode: multiply;
        pointer-events: none;
    }

    /* 🖨️ 실제 인쇄 시 적용되는 설정 */
    @media print {
        @page {
            size: A4;
            margin: 0;
        }
        html, body {
            width: 100%;
            height: auto;
            background-color: white;
            margin: 0;
            padding: 0;
            display: block;
        }
        .print-btn-container { display: none !important; }

        .a4-page {
            box-shadow: none;
            margin: 0;
            padding: 15mm;
            width: 210mm;
            height: 297mm;
            box-sizing: border-box;
            page-break-after: always;
            page-break-inside: avoid;
        }

        .a4-page:last-of-type {
            page-break-after: auto;
        }
    }
</style>
</head>
<body>

<!-- 상단 출력 버튼 -->
<div class="print-btn-container">
    <button class="print-btn" onclick="window.print()">🖨️ 인쇄하기</button>
</div>

{% for member in members %}
<div class="a4-page">
    <div class="border-box">

        <!-- 상단 수신자 -->
        <div class="recipient">
            <span class="name">{{ member.memberName }}</span>
            <!-- 상호(compName)가 없으면 memberMemo를 출력하도록 Fallback 설정 -->
            {{ member.memberJobtitle | default(member.memberMemo) }}님,
        </div>

        <!-- 중앙 본문 -->
        <div class="message">
            생신을 진심으로 축하드립니다.<br><br>
            영원불멸한 충효예의 기운이 늘 함께하시어<br>
            가정에 행복과 행운이 가득하시길 기원드립니다.
        </div>

        <!-- 하단 발신자 -->
        <div class="sender-area">
            <div class="sender-text">
                社團法人 忠孝禮 大學 理事長 柳 震 壽
                <img src="/static/img/stamp/mainstamp.png" alt="직인" class="main-stamp-img">
            </div>
        </div>

    </div>
</div>
{% endfor %}

</body>
</html>
