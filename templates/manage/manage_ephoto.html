<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="">
    <meta name="author" content="">

    <title>충효예대학 원우관리 - 사진 관리</title>

    <!-- Custom fonts for this template-->
    <link href="/static/vendor/fontawesome-free/css/all.min.css" rel="stylesheet" type="text/css">
    <link
        href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i"
        rel="stylesheet">

    <!-- Custom styles for this template-->
    <link href="/static/css/sb-admin-2.min.css" rel="stylesheet">

    <!-- 사진 관리용 커스텀 스타일 -->
    <style>
        .photo-card {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            border-radius: 0.75rem;
            overflow: hidden;
        }
        .photo-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 .5rem 1rem rgba(0,0,0,.15)!important;
        }
        .photo-img-wrapper {
            height: 250px;
            background-color: #e9ecef;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .photo-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            transition: opacity 0.3s;
            cursor: pointer; /* 클릭 가능하다는 표시(손가락 모양) 추가 */
        }
        .photo-img:hover {
            opacity: 0.8; /* 마우스 오버 시 살짝 투명해지는 효과 */
        }
    </style>
</head>

<body id="page-top">

    <!-- Page Wrapper -->
    <div id="wrapper">

        {% include 'common/sidebar.html' %}

        <!-- Content Wrapper -->
        <div id="content-wrapper" class="d-flex flex-column">

            <!-- Main Content -->
            <div id="content">

                {% include 'common/topbar.html' %}

                <!-- Begin Page Content -->
                <div class="container-fluid">

                    <!-- Page Heading -->
                    <div class="d-sm-flex align-items-center justify-content-between mb-4">
                        <h1 class="h3 mb-0 text-gray-800">사진 관리</h1>
                    </div>

                    <!-- 상단: 이벤트 선택 Select Box -->
                    <div class="row justify-content-center mb-5">
                        <div class="col-md-8 col-lg-6">
                            <select id="eventSelect" class="form-control form-control-lg shadow-sm" onchange="loadPhotos()">
                                <option value="">📸 사진을 확인할 이벤트를 선택하세요</option>
                            </select>
                        </div>
                    </div>
                    <div id="photoGrid" class="row">
                    </div>
                    <div id="emptyState" class="text-center text-muted my-5" style="display: none;">
                        <h4 class="font-weight-bold mt-4">등록된 사진이 없습니다.</h4>
                    </div>

                </div>
                <!-- /.container-fluid -->
            </div>
            <!-- End of Main Content -->

            {% include 'common/footer.html' %}

        </div>
        <!-- End of Content Wrapper -->

    </div>
    <!-- End of Page Wrapper -->

    <!-- Scroll to Top Button-->
    <a class="scroll-to-top rounded" href="#page-top">
        <i class="fas fa-angle-up"></i>
    </a>

    <!-- Logout Modal-->
    <div class="modal fade" id="logoutModal" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel"
        aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="exampleModalLabel">Ready to Leave?</h5>
                    <button class="close" type="button" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">×</span>
                    </button>
                </div>
                <div class="modal-body">Select "Logout" below if you are ready to end your current session.</div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" type="button" data-dismiss="modal">Cancel</button>
                    <a class="btn btn-primary" href="/logout">Logout</a>
                </div>
            </div>
        </div>
    </div>

    <!-- 이미지 크게 보기 Modal -->
    <div class="modal fade" id="imageModal" tabindex="-1" role="dialog" aria-labelledby="imageModalLabel" aria-hidden="true">
        <!-- modal-lg로 크게, modal-dialog-centered로 화면 중앙에 배치 -->
        <div class="modal-dialog modal-lg modal-dialog-centered" role="document">
            <!-- 배경을 투명하게 하고 테두리 제거 -->
            <div class="modal-content bg-transparent border-0">
                <div class="modal-header border-0 p-0 text-white" style="position: absolute; right: 0; z-index: 1;">
                    <!-- 닫기 버튼을 눈에 띄게 스타일링 -->
                    <button type="button" class="close text-white" data-dismiss="modal" aria-label="Close" style="opacity: 1; text-shadow: 0 0 5px black; font-size: 2.5rem; padding: 10px;">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body text-center p-0">
                    <img id="modalImage" src="" alt="Enlarged Photo" class="img-fluid rounded shadow-lg" style="max-height: 90vh;">
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap core JavaScript-->
{% include 'common/adscript.html' %}

<script>
    document.addEventListener("DOMContentLoaded", function() {
        loadEvents();
    });

    async function loadEvents() {
        try {
            const response = await fetch('/api/ephoto/events');
            const events = await response.json();
            console.log("목록 불러오기 응답 데이터:", events);
            if (!Array.isArray(events)) {
                console.error("배열 형식이 아닙니다. 백엔드 에러를 확인하세요:", events);
                return;
            }
            const select = document.getElementById('eventSelect');
            events.forEach(ev => {
                const option = document.createElement('option');
                option.value = ev.eventNo;
                option.textContent = ev.label;
                select.appendChild(option);
            });
        } catch (error) {
            console.error("이벤트 목록 로드 오류:", error);
            alert("이벤트 목록을 불러오지 못했습니다.");
        }
    }

    // API: 선택한 이벤트의 사진 로드
    async function loadPhotos() {
        const eventNo = document.getElementById('eventSelect').value;
        const grid = document.getElementById('photoGrid');
        const emptyState = document.getElementById('emptyState');

        grid.innerHTML = ''; // 기존 사진 초기화

        if (!eventNo) {
            emptyState.style.display = 'none';
            return;
        }

        try {
            const response = await fetch(`/api/ephoto/photos/${eventNo}`);
            const photos = await response.json();

            if (photos.length === 0) {
                emptyState.style.display = 'block';
            } else {
                emptyState.style.display = 'none';
                photos.forEach(photo => {
                    const col = document.createElement('div');
                    col.className = 'col-sm-6 col-md-4 col-lg-3 mb-4';
                    col.innerHTML = `
                        <div class="card h-100 shadow-sm photo-card" id="card-${photo.filename}">
                            <div class="photo-img-wrapper">
                                <img src="${photo.url}" class="photo-img" id="img-${photo.filename}" alt="Event Photo" onclick="showImageModal('${photo.url}')">
                            </div>
                            <div class="card-body p-3 d-flex flex-column justify-content-between">
                                <p class="small text-muted text-truncate mb-3" title="${photo.filename}">${photo.filename}</p>
                                <div class="d-flex justify-content-between w-100">
                                    <button class="btn btn-sm btn-outline-success flex-fill mr-1" onclick="downloadPhoto('${photo.url}', '${photo.filename}')">
                                        ⬇️ 다운
                                    </button>
                                    <button class="btn btn-sm btn-outline-primary flex-fill mx-1" onclick="rotatePhoto('${photo.filename}')">
                                        ↻ 회전
                                    </button>
                                    <button class="btn btn-sm btn-outline-danger flex-fill ml-1" onclick="deletePhoto('${photo.filename}')">
                                        🗑️ 삭제
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                    grid.appendChild(col);
                });
            }
        } catch (error) {
            console.error("사진 로드 오류:", error);
            alert("사진을 불러오지 못했습니다.");
        }
    }

    function showImageModal(url) {
        document.getElementById('modalImage').src = url;
        $('#imageModal').modal('show');
    }

    async function downloadPhoto(url, filename) {
        try {
            const response = await fetch(url);
            const blob = await response.blob();
            const blobUrl = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.style.display = 'none';
            a.href = blobUrl;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            window.URL.revokeObjectURL(blobUrl);
        } catch (error) {
            console.error("다운로드 오류:", error);
            alert("사진 다운로드에 실패했습니다.");
        }
    }

    async function rotatePhoto(filename) {
        try {
            const response = await fetch(`/api/ephoto/photos/${filename}/rotate`, { method: 'POST' });
            if (response.ok) {
                const data = await response.json();
                document.getElementById(`img-${filename}`).src = data.url;

                // 만약 모달이 열려있는 상태에서 회전을 누를 경우를 대비해 모달 이미지도 업데이트
                const modalImg = document.getElementById('modalImage');
                if(modalImg.src.includes(filename)) {
                    modalImg.src = data.url;
                }
            } else {
                alert("사진 회전에 실패했습니다.");
            }
        } catch (error) {
            console.error("회전 오류:", error);
            alert("오류가 발생했습니다.");
        }
    }

    async function deletePhoto(filename) {
        if (!confirm("정말로 이 사진을 삭제하시겠습니까? (복구할 수 없습니다)")) return;

        try {
            const response = await fetch(`/api/ephoto/photos/${filename}`, { method: 'DELETE' });
            if (response.ok) {
                document.getElementById(`card-${filename}`).closest('[class*="col-"]').remove();
                if (document.getElementById('photoGrid').children.length === 0) {
                    document.getElementById('emptyState').style.display = 'block';
                }
            } else {
                alert("사진 삭제에 실패했습니다.");
            }
        } catch (error) {
            console.error("삭제 오류:", error);
            alert("오류가 발생했습니다.");
        }
    }
</script>
</body>

</html>
