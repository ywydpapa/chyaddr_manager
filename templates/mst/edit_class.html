<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="충효예대학 원우관리">
    <meta name="author" content="">

    <title>충효예대학 원우관리 - 기수 관리</title>

    <!-- Custom fonts for this template-->
    <link href="/static/vendor/fontawesome-free/css/all.min.css" rel="stylesheet" type="text/css">
    <link href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i" rel="stylesheet">

    <!-- Custom styles for this template-->
    <link href="/static/css/sb-admin-2.min.css" rel="stylesheet">
</head>

<body id="page-top">

    <!-- Page Wrapper -->
    <div id="wrapper">

        {% include 'common/sidebar.html' %}

        <!-- Content Wrapper -->
        <div id="content-wrapper" class="d-flex flex-column">

            <!-- Main Content -->
            <div id="content">

                {% include 'common/topbar.html' %}

                <!-- Begin Page Content -->
                <div class="container-fluid">

                    <!-- Page Heading -->
                    <div class="d-sm-flex align-items-center justify-content-between mb-4">
                        <h1 class="h3 mb-0 text-gray-800">기수 관리</h1>
                    </div>

                    <!-- Content Row -->
                    <div class="row justify-content-center" style="min-height: 80vh;">
                        <div class="col-md-9">
                            <!-- Form 태그가 Table 전체를 감싸도록 수정 -->
                            <form method="POST" action="/update_class/{{ class_dtl[0] }}">
                                <table class="table table-bordered text-center" id="ranktable">
                                    <tbody>
                                        <tr>
                                            <td class="align-middle">기수명칭</td>
                                            <td>
                                                <input type="text" class="form-control" name="classtitle" value="{{ class_dtl[1] }}" required />
                                            </td>
                                        </tr>
                                        <tr>
                                            <td class="align-middle">시작일자</td>
                                            <td>
                                                <input type="date" class="form-control" name="classfr" value="{{ class_dtl[2].strftime('%Y-%m-%d') if class_dtl[2] else '' }}" required />
                                            </td>
                                        </tr>
                                        <tr>
                                            <td class="align-middle">종료일자</td>
                                            <td>
                                                <input type="date" class="form-control" name="classto" value="{{ class_dtl[3].strftime('%Y-%m-%d') if class_dtl[3] else '' }}" required />
                                            </td>
                                        </tr> <!-- 잘못 열려있던 tr 태그 수정 -->
                                        <tr>
                                            <td colspan="2">
                                                <div class="d-flex justify-content-between" style="gap: 10px;">
                                                    <a href="/classList" class="btn btn-dark" style="flex: 0 0 20%;">기수 목록</a>
                                                    <button type="submit" class="btn btn-primary" style="flex: 0 0 30%;">저장</button>
                                                </div>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </form>
                        </div>
                    </div>
                </div>
                <!-- /.container-fluid -->
            </div>
            <!-- End of Main Content -->

            {% include 'common/footer.html' %}

        </div>
        <!-- End of Content Wrapper -->

    </div>
    <!-- End of Page Wrapper -->

    <!-- Scroll to Top Button-->
    <a class="scroll-to-top rounded" href="#page-top">
        <i class="fas fa-angle-up"></i>
    </a>

    <!-- Logout Modal-->
    <div class="modal fade" id="logoutModal" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="exampleModalLabel">로그아웃 하시겠습니까?</h5>
                    <button class="close" type="button" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">×</span>
                    </button>
                </div>
                <div class="modal-body">현재 세션을 종료하시려면 아래의 "로그아웃" 버튼을 클릭하세요.</div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" type="button" data-dismiss="modal">취소</button>
                    <a class="btn btn-primary" href="/logout">로그아웃</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap core JavaScript-->
    {% include 'common/adscript.html' %}

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('msg') === 'success') {
                const toast = document.createElement('div');
                toast.innerText = "업데이트 되었습니다.";
                Object.assign(toast.style, {
                    position: 'fixed',
                    top: '20px',
                    right: '20px',
                    backgroundColor: '#1cc88a', /* SB Admin 2의 Success 컬러 */
                    color: 'white',
                    padding: '15px 25px',
                    borderRadius: '5px',
                    boxShadow: '0 4px 6px rgba(0,0,0,0.1)',
                    zIndex: '9999',
                    opacity: '1',
                    transition: 'opacity 0.5s ease-in-out',
                    fontWeight: 'bold'
                });
                document.body.appendChild(toast);

                setTimeout(() => {
                    toast.style.opacity = '0';
                    setTimeout(() => {
                        toast.remove();
                    }, 500);
                }, 2000);

                // URL에서 msg 파라미터 깔끔하게 제거
                window.history.replaceState({}, document.title, window.location.pathname);
            }
        });
    </script>
</body>

</html>
